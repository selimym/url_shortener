<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shrt.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,700&family=Cormorant:ital,wght@1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #111111;
      --surface2:  #181818;
      --border:    #252525;
      --border2:   #303030;
      --text:      #ede8df;
      --muted:     #4a4a4a;
      --muted2:    #6e6e6e;
      --orange:    #ff5500;
      --orange-lo: rgba(255,85,0,.08);
      --orange-md: rgba(255,85,0,.18);
      --error:     #ff3b3b;
    }

    ::selection { background: var(--orange); color: #fff; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 60% at 50% -10%, #2a1200 0%, transparent 60%);
      color: var(--text);
      font-family: 'Bricolage Grotesque', sans-serif;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── top strip ── */
    .strip {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      opacity: .6;
    }

    /* ── nav ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 40px;
    }

    .logo {
      font-family: 'Cormorant', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 1.35rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: .01em;
    }

    .nav-link {
      font-size: .75rem;
      font-weight: 300;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted2);
      text-decoration: none;
      transition: color .2s;
    }
    .nav-link:hover { color: var(--orange); }

    /* ── main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 80px;
    }

    .hero {
      text-align: center;
      margin-bottom: 48px;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.05;
      color: var(--text);
    }

    h1 em {
      font-style: normal;
      color: var(--orange);
    }

    .tagline {
      margin-top: 14px;
      font-size: .82rem;
      font-weight: 300;
      color: var(--muted2);
      letter-spacing: .04em;
    }

    /* ── form ── */
    .form-wrap {
      width: 100%;
      max-width: 560px;
    }

    .input-row {
      display: flex;
      border: 1px solid var(--border2);
      background: var(--surface);
      transition: border-color .2s, box-shadow .2s;
    }
    .input-row:focus-within {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-lo);
    }

    .url-input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 16px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .82rem;
      color: var(--text);
      outline: none;
      min-width: 0;
    }
    .url-input::placeholder { color: var(--muted); }

    .btn-shorten {
      flex-shrink: 0;
      border: none;
      border-left: 1px solid var(--border2);
      background: transparent;
      color: var(--muted2);
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 16px 28px;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
      white-space: nowrap;
    }
    .btn-shorten:hover  {
      background: var(--orange);
      color: #fff;
      border-left-color: var(--orange);
    }
    .btn-shorten:active { opacity: .8; }
    .btn-shorten:disabled { opacity: .35; cursor: default; }

    /* ── error ── */
    .error {
      margin-top: 12px;
      font-size: .78rem;
      color: var(--error);
      display: none;
      padding: 10px 14px;
      border: 1px solid rgba(255,59,59,.25);
      background: rgba(255,59,59,.06);
    }
    .error.show { display: block; }

    /* ── result ── */
    .result {
      display: none;
      margin-top: 20px;
      border: 1px solid var(--border2);
      background: var(--surface);
      overflow: hidden;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .3s ease, transform .3s ease;
    }
    .result.show { opacity: 1; transform: translateY(0); }

    .result-top {
      padding: 24px 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    .res-eyebrow {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 10px;
    }

    .res-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text);
      word-break: break-all;
      line-height: 1.4;
    }

    .res-copy-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .res-target {
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem;
      color: var(--muted2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .result-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      gap: 12px;
    }

    .key-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .key-label {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .key-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: .75rem;
      color: var(--muted2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .key-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── small buttons ── */
    .btn-sm {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 7px 14px;
      cursor: pointer;
      border-radius: 0;
      transition: all .18s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn-sm-outline {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--muted2);
    }
    .btn-sm-outline:hover { border-color: var(--text); color: var(--text); }
    .btn-sm-outline.copied { border-color: var(--orange); color: var(--orange); }

    .btn-sm-fill {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--muted2);
    }
    .btn-sm-fill:hover { background: var(--orange); border-color: var(--orange); color: #fff; }

    /* ── footer ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: .68rem;
      font-weight: 300;
      letter-spacing: .1em;
      color: var(--muted);
    }

    @media (max-width: 500px) {
      nav { padding: 20px; }
      h1 { font-size: 2.2rem; }
      .btn-shorten { padding: 16px 18px; font-size: .7rem; letter-spacing: .06em; }
      .result-bottom { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="strip"></div>

<nav>
  <a class="logo" href="/">shrt.</a>
  <a class="nav-link" href="/manage">Manage →</a>
</nav>

<main>
  <div class="hero">
    <h1>Long URL.<br><em>Short link.</em></h1>
    <p class="tagline">Paste any URL below and compress it instantly.</p>
  </div>

  <div class="form-wrap">
    <div class="input-row">
      <input
        id="urlInput"
        class="url-input"
        type="url"
        placeholder="https://your-very-long-url.com/goes/here"
        autocomplete="off"
        spellcheck="false"
      >
      <button class="btn-shorten" id="submitBtn">Shorten</button>
    </div>

    <div class="error" id="errBox"></div>

    <div class="result" id="result">
      <div class="result-top">
        <div class="res-eyebrow">Shortened</div>
        <div class="res-url" id="resUrl"></div>
        <div class="res-copy-row">
          <span class="res-target" id="resTarget"></span>
          <button class="btn-sm btn-sm-outline" id="copyUrl">Copy link</button>
        </div>
      </div>
      <div class="result-bottom">
        <div class="key-info">
          <span class="key-label">Key</span>
          <span class="key-val" id="resKey"></span>
        </div>
        <div class="key-actions">
          <button class="btn-sm btn-sm-outline" id="copyKey">Copy key</button>
          <a class="btn-sm btn-sm-fill" id="manageLink" href="#">Manage</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>— url compression service —</footer>

<script>
  const urlInput  = document.getElementById('urlInput');
  const submitBtn = document.getElementById('submitBtn');
  const errBox    = document.getElementById('errBox');
  const result    = document.getElementById('result');

  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  submitBtn.addEventListener('click', submit);

  async function submit() {
    const url = urlInput.value.trim();
    if (!url) { urlInput.focus(); return; }

    errBox.className = 'error';
    result.style.display = 'none';
    result.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = '…';

    try {
      const res  = await fetch('/url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target_url: url }),
      });
      const data = await res.json();

      if (!res.ok) { showErr(data.detail || 'Something went wrong.'); return; }

      const secretKey = data.admin_url.split('/admin/')[1];
      const shortKey  = data.url.split('/').filter(Boolean).pop();
      const fullUrl   = window.location.origin + '/' + shortKey;

      document.getElementById('resUrl').textContent    = fullUrl;
      document.getElementById('resTarget').textContent = '↳ ' + url.replace(/^https?:\/\//, '').substring(0, 50) + (url.length > 55 ? '…' : '');
      document.getElementById('resKey').textContent    = secretKey;
      document.getElementById('manageLink').href       = '/manage?key=' + encodeURIComponent(secretKey);

      saveToHistory({ shortUrl: fullUrl, targetUrl: url, key: secretKey });

      result.style.display = 'block';
      requestAnimationFrame(() => requestAnimationFrame(() => result.classList.add('show')));
      urlInput.value = '';
    } catch {
      showErr('Could not reach the server.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Shorten';
    }
  }

  function showErr(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }

  function makeCopy(id, getVal) {
    const btn = document.getElementById(id);
    const orig = btn.textContent;
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(getVal()).then(() => {
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1600);
      });
    });
  }
  makeCopy('copyUrl', () => document.getElementById('resUrl').textContent);
  makeCopy('copyKey', () => document.getElementById('resKey').textContent);

  function saveToHistory({ shortUrl, targetUrl, key }) {
    const STORAGE_KEY = 'shrt_history';
    const MAX = 10;
    let history = [];
    try { history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch {}
    history = history.filter(e => e.key !== key); // deduplicate
    history.unshift({ shortUrl, targetUrl, key, createdAt: new Date().toISOString() });
    if (history.length > MAX) history = history.slice(0, MAX);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  }
</script>
</body>
</html>
